<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Fake Discount BG</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="app-head">
      <img class="app-logo" src="../icons/icon48.png" alt="" width="30" height="30">
      <div class="app-title">
        <h1 id="brand-name"></h1>
        <p id="brand-subtitle"></p>
      </div>
      <button type="button" class="icon-btn" id="open-fullview"></button>
    </header>

    <nav class="tabs" role="tablist" id="tabs">
      <button type="button" class="tab" role="tab" id="tab-products" data-tab="products" aria-controls="panel-products" aria-selected="true">
        <span class="tab-label"></span><span class="tab-count" id="tab-products-count"></span>
      </button>
      <button type="button" class="tab" role="tab" id="tab-settings" data-tab="settings" aria-controls="panel-settings" aria-selected="false" tabindex="-1">
        <span class="tab-label"></span>
      </button>
      <button type="button" class="tab" role="tab" id="tab-data" data-tab="data" aria-controls="panel-data" aria-selected="false" tabindex="-1">
        <span class="tab-label"></span>
      </button>
    </nav>

    <main class="panels">
      <section class="panel" id="panel-products" data-panel="products" role="tabpanel" aria-labelledby="tab-products">
        <div class="toolbar">
          <div class="search">
            <span class="search-icon" id="search-icon"></span>
            <input type="search" id="search-input" autocomplete="off" spellcheck="false">
            <button type="button" class="search-clear" id="search-clear" hidden></button>
          </div>
          <div class="chips" id="site-filter-chips" role="group"></div>
          <div class="list-head">
            <span class="result-count" id="result-count"></span>
            <label class="sort">
              <span id="sort-label"></span>
              <select id="sort-select">
                <option value="recent"></option>
                <option value="price-asc"></option>
                <option value="price-desc"></option>
                <option value="targets"></option>
              </select>
            </label>
          </div>
        </div>
        <div class="product-list" id="product-list"></div>
        <div class="empty" id="products-empty" hidden></div>
      </section>

      <section class="panel" id="panel-settings" data-panel="settings" role="tabpanel" aria-labelledby="tab-settings" hidden></section>

      <section class="panel" id="panel-data" data-panel="data" role="tabpanel" aria-labelledby="tab-data" hidden></section>
    </main>

    <footer class="app-foot">
      <span id="footer-summary"></span>
      <span id="footer-version"></span>
    </footer>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <dialog class="dialog" id="confirm-dialog">
    <form method="dialog" class="dialog-body">
      <span class="dialog-icon" id="confirm-icon"></span>
      <h2 id="confirm-title"></h2>
      <p id="confirm-text"></p>
      <div class="dialog-actions">
        <button type="submit" value="cancel" class="btn btn-quiet" id="confirm-cancel"></button>
        <button type="submit" value="confirm" class="btn btn-danger" id="confirm-ok"></button>
      </div>
    </form>
  </dialog>

  <input type="file" id="import-file" accept=".json,application/json" hidden>

  <script src="../i18n/i18n.js"></script>
  <script src="../ui/ui-kit.js"></script>
  <script src="../background/price-tracker.js"></script>
  <script src="popup.js"></script>
</body>
</html>
